name: Summarize player sessions

on:
  schedule:
    # Twice a day, at 06:00 and 18:00 UTC. Drop the second line for once a day.
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call summarize-sessions endpoint
        env:
          CRON_SECRET: ${{ secrets.STATS_CRON_SECRET }}
        run: |
          curl -sf -X POST "https://plgames.cl/api/summarize-sessions" \
            -H "X-Cron-Secret: $CRON_SECRET"
