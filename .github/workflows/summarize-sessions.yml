name: Summarize player sessions

on:
  schedule:
    # Twice a day, at 06:00 and 18:00 UTC. Drop the second line for once a day.
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call summarize-sessions endpoint
        env:
          CRON_SECRET: ${{ secrets.STATS_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "STATS_CRON_SECRET repo secret is empty or not set -- add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          http_status=$(curl -s -L --post301 --post302 --post303 -X POST "https://www.plgames.cl/api/summarize-sessions" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -o response.json -w "%{http_code}")
          echo "HTTP status: $http_status"
          echo "Response body:"
          cat response.json
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            exit 1
          fi
